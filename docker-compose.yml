services:
  mongo:
    image: mongo:7
    container_name: digisign-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Exposed for local inspection; remove to keep the DB internal-only.
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: digisign-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/digital_signature
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:-change-me-too-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      SERVER_URL: ${SERVER_URL:-http://localhost:5000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Digital Signature <no-reply@digisign.local>}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@digisign.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@digisign.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Demo@12345}
    volumes:
      - uploads:/app/uploads
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: digisign-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  mongo_data:
  uploads:
