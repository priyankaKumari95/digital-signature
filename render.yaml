# Render Blueprint — single web service that serves the API and the built SPA
# from one origin. MongoDB is NOT hosted on Render; create a free MongoDB Atlas
# cluster and set MONGO_URI. See DEPLOYMENT-RENDER.md for full steps.

services:
  - type: web
    name: digisign
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --include=dev --legacy-peer-deps --prefix client && npm run build --prefix client && node server/src/seed.js
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_RESET_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      # Set these in the dashboard (or they're set for you when deploying via API):
      - key: MONGO_URI        # MongoDB Atlas connection string
        sync: false
      - key: CLIENT_URL       # the public URL of this service (used for verification QR + email links)
        sync: false
      - key: SERVER_URL       # same public URL
        sync: false
